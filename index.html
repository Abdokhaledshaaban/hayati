<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حياتي — الروتين والمهام في مكان واحد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#4f46e5">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#dash">حياتي</a>
  <nav id="nav"></nav>
  <div class="tools">
    <button class="ib" data-act="theme" aria-label="تبديل الوضع الليلي">◐</button>
    <details class="menu">
      <summary class="ib" aria-label="الإعدادات">⚙</summary>
      <div class="pop">
        <button class="mi" data-act="acc">🎨 غيّر لون الموقع</button>
        <button class="mi" data-act="fsu">أ+ كبّر الخط</button>
        <button class="mi" data-act="fsd">أ− صغّر الخط</button>
        <button class="mi" data-act="name">👤 اسمك</button>
        <button class="mi" data-act="notif">🔔 تنبيهات الأنشطة</button>
        <button class="mi" data-act="print">🖨️ طباعة</button>
        <button class="mi" data-act="export">⬇ تصدير نسخة احتياطية</button>
        <label class="mi">⬆ استيراد نسخة<input type="file" id="imp" accept=".json" hidden></label>
      </div>
    </details>
  </div>
</header>
<main id="view"></main>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
